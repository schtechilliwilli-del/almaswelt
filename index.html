<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almas Welt</title>
<meta name="theme-color" content="#ff6fae">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almas Welt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: Kopfzeile oben, eine Spielfläche darunter, riesige runde Tasten */
  --bg:#fff3f8;
  --ink:#4a2d5c;
  --pink:#ff6fae;
  --sun:#ffc93c;
  --mint:#4fd1b0;
  --sky:#5fb4ff;
  --lilac:#b48cff;
  --font:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
header{flex:none;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
header h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.5px;text-wrap:balance}
.round{width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(74,45,92,.18);display:grid;place-items:center}
.round:active{transform:translateY(3px);box-shadow:none}
.round svg{width:34px;height:34px}
.round[hidden]{display:block;visibility:hidden}
.round.off .wave{display:none}
.round:not(.off) .cross{display:none}
.view{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;padding:0 16px 16px;gap:14px}
.view.on{display:flex}

/* Start */
#home{flex-direction:row;flex-wrap:wrap;gap:24px 40px;overflow:auto}
.mascot{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(260px,38vw)}
.mascot svg{width:100%;height:auto}
.bubble{background:#fff;border-radius:28px;padding:12px 22px;font-size:30px;font-weight:700;box-shadow:0 4px 0 rgba(74,45,92,.15)}
.tiles{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.tile{width:min(210px,22vw);min-width:150px;aspect-ratio:1;border-radius:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 0 rgba(74,45,92,.2);font-size:28px;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(74,45,92,.25)}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(74,45,92,.2)}
.tile svg{width:62%;height:auto}
.t-glitter{background:var(--lilac)}
.t-paint{background:var(--mint)}
.t-memory{background:var(--sky)}

/* Glitzer */
#glitter{position:relative;justify-content:flex-end;touch-action:none}
#glitter .hint{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,8vw,90px);font-weight:700;color:rgba(180,140,255,.45);pointer-events:none;text-align:center;padding:20px}
.big{padding:18px 40px;border-radius:999px;background:var(--pink);color:#fff;font-size:34px;font-weight:700;box-shadow:0 8px 0 rgba(74,45,92,.25);position:relative}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(74,45,92,.25)}

/* Ausmalen */
.picker{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pick{padding:10px 22px;border-radius:999px;background:#fff;font-size:24px;font-weight:700;box-shadow:0 4px 0 rgba(74,45,92,.18)}
.pick[aria-pressed="true"]{background:var(--ink);color:#fff}
#stage{flex:1;min-height:0;width:100%;display:grid;place-items:center;position:relative}
.ref{position:absolute;top:6px;right:6px;width:clamp(90px,15vw,140px);background:#fff;border-radius:20px;padding:6px;box-shadow:0 4px 0 rgba(74,45,92,.18);pointer-events:none;z-index:2}
.ref svg{display:block;width:100%;height:auto}
.ref[hidden]{display:none}
#pic{height:100%;max-height:100%;width:auto;max-width:100%;aspect-ratio:1;background:#fff;border-radius:32px;box-shadow:0 6px 0 rgba(74,45,92,.15)}
.r{fill:#fff;stroke:var(--ink);stroke-width:9;stroke-linejoin:round;stroke-linecap:round;cursor:pointer}
.line{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round}
.dot{fill:var(--ink)}
.thumb{width:78px;height:78px;padding:6px;border-radius:22px;background:#fff;box-shadow:0 4px 0 rgba(74,45,92,.18)}
.thumb svg{display:block;width:100%;height:100%}
.thumb[aria-pressed="true"]{outline:5px solid var(--ink);outline-offset:2px}
.tools{display:flex;gap:18px 28px;flex-wrap:wrap;justify-content:center;align-items:center}
.modes{display:flex;gap:12px}
.mode{display:flex;align-items:center;gap:8px;padding:8px 22px 8px 14px;border-radius:999px;background:#fff;font-size:24px;font-weight:700;box-shadow:0 4px 0 rgba(74,45,92,.18)}
.mode svg{width:34px;height:34px}
.mode[aria-pressed="true"]{background:var(--ink);color:#fff}
.ol{fill:none;stroke:var(--ink);stroke-width:9;stroke-linejoin:round;pointer-events:none}
#pic{touch-action:none}
.palette{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.sw{width:64px;height:64px;border-radius:50%;border:5px solid #fff;box-shadow:0 4px 0 rgba(74,45,92,.25)}
.sw[aria-pressed="true"]{outline:5px solid var(--ink);outline-offset:2px;transform:scale(1.1)}
.sw.white{border-color:#d9c9e6}

/* Memorie */
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
#board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:10px;width:min(100%,calc((100dvh - 210px) * var(--cols,4) / var(--rows,2)))}
.card{aspect-ratio:1;perspective:700px;position:relative}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 5px 0 rgba(74,45,92,.2)}
.front{background:radial-gradient(circle at 30% 30%,#ffd1e6 0 12%,transparent 13%),radial-gradient(circle at 70% 65%,#d6c2ff 0 14%,transparent 15%),linear-gradient(135deg,var(--pink),var(--lilac))}
.back{background:#fff;transform:rotateY(180deg)}
.back svg{width:72%;height:72%}
.card.done .back{background:#effff9}
#win,#win3{font-size:clamp(34px,6vw,60px);font-weight:700;color:var(--pink);min-height:1.2em;text-align:center}

.back img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;border-radius:16px;background:radial-gradient(130% 34% at 50% 104%,#a6e486 0 62%,transparent 63%),radial-gradient(circle at 18% 22%,#fff 0 3px,transparent 4px),radial-gradient(circle at 84% 16%,#fff 0 4px,transparent 5px),radial-gradient(circle at 70% 34%,#ffe27a 0 3px,transparent 4px),linear-gradient(#bfe3ff,#fff0f8)}
.t-friends{background:#ff9a3c}.t-puzzle{background:#ff6fae}
.friends{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center;flex:1;min-height:0;width:100%;overflow:auto}
.friend{display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border-radius:34px;padding:14px;box-shadow:0 8px 0 rgba(74,45,92,.18)}
.friend:active{transform:translateY(5px)}
.friend img{display:block;width:min(15vw,36dvh,300px);height:min(15vw,36dvh,300px);border-radius:24px;object-fit:contain;padding:8px;background:radial-gradient(130% 34% at 50% 104%,#a6e486 0 62%,transparent 63%),radial-gradient(circle at 18% 22%,#fff 0 3px,transparent 4px),radial-gradient(circle at 84% 16%,#fff 0 4px,transparent 5px),radial-gradient(circle at 70% 34%,#ffe27a 0 3px,transparent 4px),linear-gradient(#bfe3ff,#fff0f8)}
.comic{width:min(15vw,36dvh,300px);height:min(15vw,36dvh,300px);background:#fff7e0;border-radius:24px;display:grid;place-items:center}
.comic svg{width:92%;height:92%}
.friend span{font-size:34px;font-weight:700}
.pieces{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;position:relative;z-index:5}
.piece{position:relative;width:clamp(80px,13vw,120px);aspect-ratio:1;background:#fff;border-radius:18px;padding:5px;box-shadow:0 5px 0 rgba(74,45,92,.2);touch-action:none;cursor:grab}
.piece svg{display:block;width:100%;height:100%;border-radius:13px}
.piece.sel{outline:6px solid var(--sun);outline-offset:2px}
.piece.gone{visibility:hidden}
#sceneBox{flex:1;min-height:0;width:100%;display:grid;place-items:center}
#scene{height:100%;width:auto;max-width:100%;aspect-ratio:4/3;border-radius:24px;box-shadow:0 6px 0 rgba(74,45,92,.15);background:#fff}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#puzzle{position:relative}
#win3{position:absolute;top:84px;left:0;right:0;min-height:0;pointer-events:none;z-index:6;text-shadow:0 3px 0 #fff}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.in{transition:none}}

/* ===== Neue Bereiche ===== */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#cfe9ff}
#bg>svg{position:absolute;inset:0;width:100%;height:100%}
#fall{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fall span{position:absolute;top:-12%;animation:fall linear infinite;opacity:.92}
@keyframes fall{to{transform:translate(var(--dx,40px),118vh) rotate(var(--rot,200deg))}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
body.night header h1{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
body.night .bubble{background:#fff}
body.night .sectionhead,body.night .say2{color:#fff}
body.night .say2{color:var(--ink)}
.tiles{max-width:min(1100px,100%)}
.tiles .tile{width:min(168px,19vw);min-width:128px;font-size:24px;border-radius:32px}
.tile .em{font-size:clamp(48px,7vw,70px);line-height:1}
.envbar{flex-basis:100%;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.envbar .pick{font-size:22px;padding:8px 18px}
.t-c1{background:#ff8fc7}.t-c2{background:#4fd1b0}.t-c3{background:#5fb4ff}.t-c4{background:#b48cff}
.t-c5{background:#ffb24d}.t-c6{background:#7bc67e}.t-c7{background:#ff7a7a}.t-c8{background:#6fc8e8}
.sectionhead{flex-basis:100%;text-align:center;font-size:22px;font-weight:700;opacity:.85}

/* Quiz */
.qmodes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.qprog{display:flex;gap:8px}
.qprog i{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(74,45,92,.2)}
.qprog i.d{background:var(--mint)}
.qprog i.c{background:var(--sun);transform:scale(1.25)}
.qcard{background:#fff;border-radius:36px;padding:10px 40px;box-shadow:0 8px 0 rgba(74,45,92,.18);display:flex;flex-direction:column;align-items:center;gap:0}
.qcard .qe{font-size:clamp(70px,16dvh,150px);line-height:1.1}
.qcard .qn{font-size:clamp(28px,5dvh,44px);font-weight:700}
.qchoices{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.qc{min-width:clamp(120px,17vw,190px);padding:12px 18px;border-radius:30px;box-shadow:0 7px 0 rgba(74,45,92,.22);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(22px,3.4dvh,30px);font-weight:700;background:#fff}
.qc .ce{font-size:clamp(44px,8dvh,70px);line-height:1.1}
.qc:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(74,45,92,.22)}
.qc.ok{outline:6px solid var(--mint);outline-offset:2px}
.qc.hint{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.qexp{min-height:2.6em;max-width:min(900px,92vw);text-align:center;font-size:clamp(22px,3.6dvh,32px);font-weight:600;color:var(--ink);background:rgba(255,255,255,.85);border-radius:22px;padding:6px 18px}
.qexp:empty{visibility:hidden}
.qnext{font-size:30px;padding:12px 38px}
.qnext[hidden]{display:none}

/* Memorie Rosa */
.pboard{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:10px;width:min(100%,calc((100dvh - 210px) * var(--cols,4) / var(--rows,2)))}
.pink .front{background:radial-gradient(circle at 30% 30%,#fff 0 6%,transparent 7%),radial-gradient(circle at 70% 65%,#ffe3f1 0 9%,transparent 10%),linear-gradient(135deg,#ff8cc6,#ffc0de)}
.pink .back .em{font-size:clamp(40px,9dvh,90px);line-height:1}

/* Puppe */
#doll{flex-direction:row;gap:24px;align-items:stretch;justify-content:center}
.dollside{flex:0 1 40%;display:flex;align-items:center;justify-content:center;min-height:0}
#dollSvg{height:100%;max-height:100%;width:auto;max-width:100%;background:rgba(255,255,255,.65);border-radius:36px;padding:8px}
.dollpanel{flex:1 1 50%;display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slotb{padding:8px 16px;border-radius:999px;background:#fff;font-size:22px;font-weight:700;box-shadow:0 4px 0 rgba(74,45,92,.18)}
.slotb[aria-pressed="true"]{background:var(--ink);color:#fff}
.items{display:flex;gap:12px;flex-wrap:wrap}
.itm{width:clamp(70px,10vw,98px);height:clamp(70px,10vw,98px);border-radius:22px;background:#fff;padding:4px;box-shadow:0 4px 0 rgba(74,45,92,.18);display:grid;place-items:center;font-size:34px;font-weight:700}
.itm svg{width:100%;height:100%;display:block}
.itm[aria-pressed="true"]{outline:5px solid var(--ink);outline-offset:2px}
@media (max-width:760px){#doll{flex-direction:column}.dollside{flex:1 1 50%}}

/* Bad */
.steps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stp{padding:6px 14px;border-radius:999px;background:#fff;font-size:20px;font-weight:700;opacity:.65}
.stp.cur{opacity:1;background:var(--sun)}
.stp.done{opacity:1;background:#d6ffe9}
.bigtarget{width:min(54vw,48dvh);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 10px 0 rgba(74,45,92,.2);display:grid;place-items:center;font-size:min(30vw,26dvh);line-height:1}
.bigtarget:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(74,45,92,.2)}
.say2{font-size:clamp(28px,5dvh,44px);font-weight:700;text-align:center;background:rgba(255,255,255,.85);border-radius:24px;padding:6px 24px}
.dots{display:flex;gap:10px}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(74,45,92,.2)}
.dots i.d{background:var(--pink)}
.bub{position:fixed;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(160,220,255,.55));border:2px solid rgba(255,255,255,.95);pointer-events:none;z-index:60;animation:bubUp 1.6s ease-out forwards}
@keyframes bubUp{to{transform:translateY(-130px) scale(1.3);opacity:0}}

/* Auto */
#car{padding:0}
#carWorld{position:relative;flex:1;width:100%;min-height:0;overflow:hidden;border-radius:30px}
#carRoad{position:absolute;left:0;right:0;bottom:0;height:26%;background:#5b5b6e;border-top:10px solid #8a8aa0}
#carRoad:after{content:"";position:absolute;left:0;right:0;top:48%;height:10px;background:repeating-linear-gradient(90deg,#fff 0 60px,transparent 60px 120px);animation:road 4s linear infinite}
@keyframes road{to{background-position-x:-120px}}
#carCar{position:absolute;left:14%;bottom:7%;font-size:min(16vw,22dvh);line-height:1;animation:bounce 1.2s ease-in-out infinite;transform:scaleX(-1)}
@keyframes bounce{50%{transform:scaleX(-1) translateY(-8px)}}
#carCar.hop{animation:hop .6s}
@keyframes hop{40%{transform:scaleX(-1) translateY(-60px)}}
.fly{position:absolute;font-size:min(11vw,15dvh);line-height:1;padding:6px;will-change:transform}
.fly.pop{animation:popo .4s forwards}
@keyframes popo{to{transform:translate(var(--x),var(--y)) scale(1.8);opacity:0}}
#carScore{position:absolute;top:10px;left:14px;font-size:36px;font-weight:700;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 20px;z-index:3}

/* Wochentage */
.week{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.day{width:clamp(110px,12.5vw,150px);height:clamp(140px,28dvh,210px);border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 0 rgba(74,45,92,.2);font-size:clamp(26px,3.4vw,40px);font-weight:700;color:#fff}
.day small{font-size:clamp(16px,2dvh,22px);font-weight:600;opacity:.95}
.day.work{background:var(--sky)}.day.free{background:#ffb24d}
.day.today{outline:8px solid var(--ink);outline-offset:3px}
.day.next{animation:pulse .8s infinite;outline:8px solid var(--sun);outline-offset:3px}
.day:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(74,45,92,.2)}

/* Zaehlen */
#cArea{position:relative;flex:1;min-height:0;width:100%}
.cobj{position:absolute;font-size:min(14vw,17dvh);line-height:1;transform:translate(-50%,-50%);padding:4px;transition:transform .25s}
.cobj.on{transform:translate(-50%,-50%) scale(.8);filter:grayscale(.2);opacity:.9}
.cobj.on:after{content:"\2713";position:absolute;right:-6px;top:-6px;width:38px;height:38px;border-radius:50%;background:var(--mint);color:#fff;font-size:26px;display:grid;place-items:center}

/* Schreiben */
#wText{flex:1;min-height:0;width:100%;background:rgba(255,255,255,.9);border-radius:30px;padding:16px 26px;font-size:clamp(48px,9dvh,90px);font-weight:700;line-height:1.15;overflow:auto;white-space:pre-wrap;word-break:break-word;box-shadow:0 6px 0 rgba(74,45,92,.15)}
#wText.empty{color:rgba(74,45,92,.35);font-size:clamp(30px,5dvh,48px)}
.krow{display:flex;gap:7px;justify-content:center}
.key{min-width:clamp(40px,6.4vw,76px);height:clamp(48px,8.6dvh,76px);padding:0 8px;border-radius:16px;background:#fff;box-shadow:0 5px 0 rgba(74,45,92,.2);font-size:clamp(24px,4.2dvh,38px);font-weight:700}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(74,45,92,.2)}
.key.wide{min-width:clamp(120px,22vw,280px)}
.key.act{background:var(--lilac);color:#fff}

/* Galerie */
.gbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.gnote{font-size:18px;font-weight:600;background:rgba(255,255,255,.85);border-radius:16px;padding:4px 14px;max-width:90vw;text-align:center}
.ggrid{flex:1;min-height:0;width:100%;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(120px,18vw,200px),1fr));gap:12px;align-content:start}
.gi{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 5px 0 rgba(74,45,92,.2);padding:0}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.gi .play{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#gview{position:fixed;inset:0;z-index:80;background:rgba(30,15,45,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#gview.on{display:flex}
#gview img,#gview video{max-width:94vw;max-height:76dvh;border-radius:20px;background:#000}
#gview .gbar .pick{font-size:26px}
@media (prefers-reduced-motion:reduce){#fall span,.tw{animation:none}}

/* ===== Ausmalen: grosses Bild mit Pfeilen ===== */
#paint{gap:8px;padding:0 8px 10px}
#paint #picker{display:none}
#paint #stage{width:100%}
.navb{position:absolute;top:50%;width:clamp(52px,9vw,84px);height:clamp(52px,9vw,84px);margin-top:calc(clamp(52px,9vw,84px) / -2);border-radius:50%;background:rgba(255,255,255,.93);box-shadow:0 3px 14px rgba(0,0,0,.22);display:grid;place-items:center;z-index:4;color:var(--ink)}
.navb svg{width:56%;height:56%}
.navb.l{left:4px}.navb.r{right:4px}
.navb:active{transform:scale(.92)}
#paint .tools{gap:8px 16px}
#paint .mode{font-size:clamp(18px,2.4dvh,24px);padding:6px 16px 6px 12px}
#paint .palette{gap:8px}
#paint .sw{width:clamp(38px,10.5vw,64px);height:clamp(38px,10.5vw,64px);border-width:4px}
#acts{display:flex;gap:10px}

/* Deutsche Rechtschreibung: Nomen gross, nichts erzwungen klein */
header h1,.welcome,.tile,.tiles .tile,.big{text-transform:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="glRosa" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#ff8fc7"/><polygon points="6,-1 8.4,4.6 14,7 8.4,9.4 6,15 3.6,9.4 -2,7 3.6,4.6" fill="#fff"/><polygon points="20,13 21.8,17.2 26,19 21.8,20.8 20,25 18.2,20.8 14,19 18.2,17.2" fill="#ffe6f3"/><circle cx="20" cy="5" r="2" fill="#fff"/></pattern><pattern id="glBlau" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#3f8cff"/><polygon points="6,-1 8.4,4.6 14,7 8.4,9.4 6,15 3.6,9.4 -2,7 3.6,4.6" fill="#fff"/><polygon points="20,13 21.8,17.2 26,19 21.8,20.8 20,25 18.2,20.8 14,19 18.2,17.2" fill="#cfe6ff"/><circle cx="20" cy="5" r="2" fill="#fff"/></pattern><pattern id="glGold" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#ffc93c"/><polygon points="6,-1 8.4,4.6 14,7 8.4,9.4 6,15 3.6,9.4 -2,7 3.6,4.6" fill="#fff"/><polygon points="20,13 21.8,17.2 26,19 21.8,20.8 20,25 18.2,20.8 14,19 18.2,17.2" fill="#fff6c9"/><circle cx="20" cy="5" r="2" fill="#fff"/></pattern><pattern id="glRegen" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#ff8fc7"/><rect width="26" height="5" fill="#ff4d4d"/><rect y="5" width="26" height="5" fill="#ff9a3c"/><rect y="10" width="26" height="5" fill="#ffd23f"/><rect y="15" width="26" height="5" fill="#3ecf6d"/><rect y="20" width="26" height="6" fill="#3f8cff"/><polygon points="6,4 8.4,9.6 14,12 8.4,14.4 6,20 3.6,14.4 -2,12 3.6,9.6" fill="#fff"/><polygon points="20,12 21.8,16.2 26,18 21.8,19.8 20,24 18.2,19.8 14,18 18.2,16.2" fill="#fff"/></pattern></defs></svg>
<div id="app">
  <header>
    <button class="round" id="homeBtn" aria-label="Zurück zum Start" hidden>
      <svg viewBox="0 0 40 40"><path d="M6 20 L20 7 L34 20" fill="none" stroke="#4a2d5c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 18 V33 H30 V18" fill="#ffd23f" stroke="#4a2d5c" stroke-width="4" stroke-linejoin="round"/></svg>
    </button>
    <h1>Almas Welt</h1>
    <button class="round" id="soundBtn" aria-label="Stimme an oder aus">
      <svg viewBox="0 0 40 40"><path d="M6 15 H13 L22 7 V33 L13 25 H6Z" fill="#4a2d5c" stroke="#4a2d5c" stroke-width="3" stroke-linejoin="round"/><g class="wave" fill="none" stroke="#4a2d5c" stroke-width="3.5" stroke-linecap="round"><path d="M27 14 Q31 20 27 26"/><path d="M31 9 Q38 20 31 31"/></g><g class="cross" stroke="#ff4d4d" stroke-width="4" stroke-linecap="round"><path d="M27 14 L37 26"/><path d="M37 14 L27 26"/></g></svg>
    </button>
  </header>

  <!-- Start -->
  <main class="view on" id="home">
    <button class="mascot" id="mascot" aria-label="Hallo sagen">
      <div class="bubble">Hallo Alma!</div>
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <path d="M82 70 L100 6 L122 72Z" fill="#ffc93c" stroke="#4a2d5c" stroke-width="5" stroke-linejoin="round"/>
        <path d="M90 40 L112 46 M86 56 L116 62" stroke="#4a2d5c" stroke-width="4" stroke-linecap="round"/>
        <path d="M54 78 L48 38 L82 66Z" fill="#fff" stroke="#4a2d5c" stroke-width="5" stroke-linejoin="round"/>
        <path d="M146 78 L152 38 L118 66Z" fill="#fff" stroke="#4a2d5c" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="46" cy="100" r="22" fill="#ff6fae" stroke="#4a2d5c" stroke-width="5"/>
        <circle cx="42" cy="140" r="22" fill="#b48cff" stroke="#4a2d5c" stroke-width="5"/>
        <circle cx="62" cy="172" r="18" fill="#5fb4ff" stroke="#4a2d5c" stroke-width="5"/>
        <ellipse cx="108" cy="118" rx="58" ry="56" fill="#fff" stroke="#4a2d5c" stroke-width="5"/>
        <circle cx="86" cy="108" r="8" fill="#4a2d5c"/><circle cx="130" cy="108" r="8" fill="#4a2d5c"/>
        <circle cx="72" cy="128" r="9" fill="#ffb3d3"/><circle cx="144" cy="128" r="9" fill="#ffb3d3"/>
        <path d="M92 132 Q108 148 124 132" fill="none" stroke="#4a2d5c" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="tiles">
      <button class="tile t-glitter" data-go="glitter" data-say="Glitzer">
        <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 62,38 95,40 69,60 79,93 50,74 21,93 31,60 5,40 38,38" fill="#ffc93c" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><circle cx="14" cy="16" r="5" fill="#fff"/><circle cx="88" cy="12" r="4" fill="#fff"/><circle cx="90" cy="84" r="5" fill="#fff"/></svg>
        Glitzer
      </button>
      <button class="tile t-paint" data-go="paint" data-say="Ausmalen">
        <svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(35 50 50)"><rect x="38" y="10" width="24" height="62" rx="4" fill="#ff6fae" stroke="#fff" stroke-width="5"/><polygon points="38,72 62,72 50,95" fill="#ffd9a0" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><polygon points="45,86 55,86 50,95" fill="#4a2d5c"/></g></svg>
        Ausmalen
      </button>
      <button class="tile t-memory" data-go="memory" data-say="Memorie">
        <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="8" y="22" width="40" height="56" rx="8" fill="#ff6fae" stroke="#fff" stroke-width="5" transform="rotate(-10 28 50)"/><rect x="52" y="22" width="40" height="56" rx="8" fill="#ffc93c" stroke="#fff" stroke-width="5" transform="rotate(10 72 50)"/><polygon points="72,38 76,48 86,48 78,55 81,65 72,59 63,65 66,55 58,48 68,48" fill="#fff" transform="rotate(10 72 50)"/></svg>
        Memorie
      </button>
 <button class="tile t-puzzle" data-go="puzzle" data-say="Puzzle">
        <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="8" y="8" width="40" height="40" rx="6" fill="#fff"/><rect x="52" y="8" width="40" height="40" rx="6" fill="#fff" opacity=".6"/><rect x="8" y="52" width="40" height="40" rx="6" fill="#fff" opacity=".6"/><rect x="52" y="52" width="40" height="40" rx="6" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="9 7"/></svg>
        Puzzle
      </button>
      <button class="tile t-friends" data-go="friends" data-say="Meine Freunde">
        <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#fff"><ellipse cx="50" cy="66" rx="24" ry="20"/><ellipse cx="22" cy="42" rx="10" ry="13"/><ellipse cx="40" cy="26" rx="10" ry="13"/><ellipse cx="60" cy="26" rx="10" ry="13"/><ellipse cx="78" cy="42" rx="10" ry="13"/></g></svg>
        Freunde
      </button>
    </div>
  </main>

  <!-- Glitzer -->
  <main class="view" id="glitter">
    <div class="hint">Tipp auf den Bildschirm</div>
    <button class="big" id="rainBtn">Glitzerregen</button>
  </main>

  <!-- Ausmalen -->
  <main class="view" id="paint">
    <div class="picker" id="picker"></div>
    <div id="stage"><div class="ref" id="ref" hidden></div><svg id="pic" viewBox="0 0 400 400" role="img" aria-label="Ausmalbild"></svg></div>
    <div class="tools">
      <div class="modes" id="modes">
        <button class="mode" data-m="bucket" aria-pressed="true"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 17 H32 L29 35 H11Z" fill="currentColor"/><path d="M12 17 C12 5 28 5 28 17" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>Eimer</button>
        <button class="mode" data-m="pen" aria-pressed="false"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 32 L10 24 L28 6 L34 12 L16 30Z" fill="currentColor"/><path d="M8 32 L10 24 L16 30Z" fill="#ffd9a0"/></svg>Stift</button>
      </div>
      <div class="palette" id="palette"></div>
    </div>
  </main>

  <!-- Memorie -->
  <main class="view" id="memory">
    <div class="bar">
      <button class="pick pairBtn" data-n="4" aria-pressed="true">4 Paare</button>
      <button class="pick pairBtn" data-n="6" aria-pressed="false">6 Paare</button>
      <button class="pick pairBtn" data-n="10" aria-pressed="false">10 Paare</button>
      <button class="pick pairBtn" data-n="15" aria-pressed="false">15 Paare</button>
      <button class="pick" id="againBtn">Neu mischen</button>
    </div>
    <div id="win" aria-live="polite"></div>
    <div id="board"></div>
  </main>

  <!-- Freunde -->
  <main class="view" id="friends">
    <div class="friends" id="friendList"></div>
  </main>

  <!-- Puzzle -->
  <main class="view" id="puzzle">
    <div class="bar"><button class="pick" id="puzzleAgain">Nochmal</button></div>
    <div id="win3" aria-live="polite"></div>
    <div class="pieces" id="pieces"></div>
    <div id="sceneBox"><svg id="scene" viewBox="0 0 400 300" role="img" aria-label="Wiesenbild mit Lücken"></svg></div>
  </main>
</div>

    u.lang = 'de-DE'; u.rate = 0.85; u.pitch = 1.15;
    var v = speechSynthesis.getVoices().filter(function(x){ return x.lang && x.lang.indexOf('de') === 0; })[0];

var P = [], running = false, DPR = Math.min(window.devicePixelRatio || 1, 2);

addEventListener('resize', sizeFx); sizeFx();
function add(x, y, vx, vy, life, s){

  if (!running){ running = true; requestAnimationFrame(tick); }
}
function burst(x, y, n){
  for (var i = 0; i < n; i++){
    var a = Math.random()*6.28, sp = 2 + Math.random()*6;
    add(x, y, Math.cos(a)*sp, Math.sin(a)*sp - 2, 60 + Math.random()*40, 7 + Math.random()*10);
  }
}
function rain(n){
  for (var i = 0; i < n; i++){
    setTimeout(function(){
      add(Math.random()*innerWidth, -20, (Math.random()-.5)*1.5, 2 + Math.random()*3, 400, 8 + Math.random()*11);
    }, Math.random()*1400);
  }
}
function drawStar(s){
  ctx.beginPath();
  for (var i = 0; i < 8; i++){
    var rad = i % 2 ? s*0.32 : s, a = i * Math.PI/4;
    ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a)*rad, Math.sin(a)*rad);
  }
  ctx.closePath(); ctx.fill();
}

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, fx.width, fx.height);

  selP = null; pDone = 0; drag = null; win3.textContent = '';
  var covers = HOLES.map(function(h){
    return '<rect class="hole" data-k="' + h.k + '" x="' + h.x + '" y="' + h.y + '" width="80" height="80" rx="6" fill="#f3e9ff" stroke="#b48cff" stroke-width="4" stroke-dasharray="8 6"/>';

  });

function clearSel(){ pieces.querySelectorAll('.sel').forEach(function(x){ x.classList.remove('sel'); }); }
function attachPiece(el){
  el.addEventListener('pointerdown', function(e){
    if (el.classList.contains('gone')) return;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    drag = {el: el, sx: e.clientX, sy: e.clientY, moved: false};
    el.style.zIndex = 20;
  });
  el.addEventListener('pointermove', function(e){
    if (!drag || drag.el !== el) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 10) drag.moved = true;
    if (drag.moved) el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.15)';
  });
  el.addEventListener('pointerup', function(e){
    if (!drag || drag.el !== el) return;
    var d = drag; drag = null; el.style.zIndex = '';
    if (!d.moved){
      var was = (selP === el); clearSel(); selP = null;
      if (!was){ selP = el; el.classList.add('sel'); say(el.dataset.k); }
      return;
    }
    var hit = null;
    scene.querySelectorAll('.hole').forEach(function(r){
      var b = r.getBoundingClientRect();
      if (e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom) hit = r;
    });
    if (hit) attempt(el, hit); else el.style.transform = '';
  });
  el.addEventListener('pointercancel', function(){
    if (drag && drag.el === el){ drag = null; el.style.transform = ''; el.style.zIndex = ''; }
  });
}
function attempt(el, hole){
  if (el.dataset.k === hole.dataset.k){
    var b = hole.getBoundingClientRect();
    hole.remove(); el.classList.add('gone'); el.classList.remove('sel'); el.style.transform = ''; selP = null; pDone++;
    burst(b.left + b.width/2, b.top + b.height/2, 28); say(el.dataset.k + '!');
    if (pDone === HOLES.length){
      win3.textContent = 'Super, Alma!';
      setTimeout(function(){ say('Toll gemacht, Alma!'); rain(200); }, 900);
    }
  } else {
    el.style.transform = ''; clearSel(); selP = null;
    el.classList.add('shake'); setTimeout(function(){ el.classList.remove('shake'); }, 400);
    say('Probier noch mal!');
  }
}

  }
}

var wV = addView('write'), wTxt = '', wCols = ['#ff4d4d','#ff9a3c','#e0a800','#3ecf6d','#3f8cff','#a46bff','#ff6fae','#22c7c1'];
wV.innerHTML = '<div id="wText" class="empty">Tipp auf die Buchstaben</div><div id="keys"></div>';
var ROWS = ['QWERTZUIOPÜ', 'ASDFGHJKLÖÄ', 'YXCVBNM'];
function wDraw(){
  var t = $('#wText');
  if (!wTxt){ t.className = 'empty'; t.textContent = 'Tipp auf die Buchstaben'; return; }
  t.className = ''; t.innerHTML = '';
  for (var i = 0; i < wTxt.length; i++){ var s = el('span'); s.style.color = wCols[i % wCols.length]; s.textContent = wTxt[i]; t.appendChild(s); }
}
function wAdd(ch){ if (wTxt.length < 200){ wTxt += ch; wDraw(); } }
function wKey(label, cls, fn){ var b = el('button', 'key ' + (cls || ''), label); b.addEventListener('click', fn); return b; }
(function(){
  var box = $('#keys', wV);
  ROWS.forEach(function(r){
    var row = el('div', 'krow');
    r.split('').forEach(function(ch){ row.appendChild(wKey(ch, '', function(){ wAdd(ch); say(ch); })); });
    box.appendChild(row);
  });
  var last = el('div', 'krow');
  last.appendChild(wKey('Leerzeichen', 'wide', function(){ wAdd(' '); }));
  last.appendChild(wKey('⌫', 'act', function(){ wTxt = wTxt.slice(0, -1); wDraw(); }));
  last.appendChild(wKey('🧹', 'act', function(){ wTxt = ''; wDraw(); say('Alles weg'); }));
  last.appendChild(wKey('🔊 Vorlesen', 'act', function(){ if (wTxt.trim()) say(wTxt); }));
  box.appendChild(last);
  box.style.cssText = 'display:flex;flex-direction:column;gap:7px;width:100%';
})();
addEventListener('keydown', function(e){
  if (current !== 'write' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Backspace'){ wTxt = wTxt.slice(0, -1); wDraw(); e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'Enter'){ wAdd(e.key === ' ' ? ' ' : '\n'); e.preventDefault(); }
  else if (e.key.length === 1 && /[A-Za-zÄÖÜäöüß0-9!?.,]/.test(e.key)){ var ch = e.key.toUpperCase(); wAdd(ch); say(ch); }
});

/* ================= Bildergalerie ================= */
var gV = addView('gallery'), gal = {assets: null, db: null, items: [], local: [], inited: false, delArm: null};
gV.innerHTML = '<div class="gbar"><label class="big" style="cursor:pointer">📷 Bild oder Video hinzufügen<input id="gFile" type="file" accept="image/*,video/*" multiple hidden></label></div><div class="gnote" id="gNote"></div><div class="ggrid" id="gGrid"></div>';
var viewer = el('div'); viewer.id = 'gview';
viewer.innerHTML = '<div id="gMedia"></div><div class="gbar"><button class="pick" id="gClose">✕ Schließen</button><button class="pick" id="gDel">🗑 Löschen</button></div>';
document.body.appendChild(viewer);
function gNote(t){ $('#gNote').textContent = t || ''; $('#gNote').style.display = t ? '' : 'none'; }
function gInfo(){
  if (!gal.assets || !gal.db) gNote('Hier werden Bilder nur gespeichert, wenn die Seite von Papa geöffnet wird. Sonst bleiben sie nur, solange die Seite offen ist.');
  else gNote('');
}
function gRender(){
  var all = gal.items.concat(gal.local), g = $('#gGrid'); g.innerHTML = '';
  if (!all.length){ var em = el('div', 'say2', 'Noch keine Bilder. Tipp oben auf die Taste.'); em.style.gridColumn = '1/-1'; g.appendChild(em); return; }
  all.forEach(function(it){
    var b = el('button', 'gi'); b.setAttribute('aria-label', 'Bild öffnen');
    b.innerHTML = (it.kind === 'video' ? '<video src="' + it.url + '#t=0.1" preload="metadata" muted playsinline></video><span class="play">▶</span>' : '<img src="' + it.url + '" alt="">');
    b.addEventListener('click', function(){ gOpen(it); });
    g.appendChild(b);
  });
}
var gCur = null;
function gOpen(it){
  gCur = it; gal.delArm = null; $('#gDel').textContent = '🗑 Löschen';
  $('#gMedia').innerHTML = it.kind === 'video' ? '<video src="' + it.url + '" controls playsinline autoplay></video>' : '<img src="' + it.url + '" alt="">';
  viewer.classList.add('on');
}
function gClose(){ viewer.classList.remove('on'); $('#gMedia').innerHTML = ''; gCur = null; }
$('#gClose').addEventListener('click', gClose);
$('#gDel').addEventListener('click', function(){
  if (!gCur) return;
  if (gal.delArm !== gCur){ gal.delArm = gCur; this.textContent = 'Wirklich löschen?'; return; }
  var it = gCur; gClose();
  if (it.local){ gal.local = gal.local.filter(function(x){ return x !== it; }); gRender(); return; }
  try {
    if (gal.db) gal.db.collection('gallery').doc(it.id).delete();
    if (gal.assets && it.aid) gal.assets.delete(it.aid).catch(function(){});
  } catch (e) {}
});
$('#gFile').addEventListener('change', function(ev){
  var files = Array.prototype.slice.call(ev.target.files || []); ev.target.value = '';
  files.forEach(function(f){
    var kind = f.type.indexOf('video') === 0 ? 'video' : f.type.indexOf('image') === 0 ? 'image' : null;
    if (!kind) return;
    if (gal.assets && gal.db){
      gNote('Wird gespeichert ...');
      gal.assets.upload(f).then(function(res){
        var id = 'g' + Date.now().toString(36) + (Math.random() * 1e4 | 0);
        return gal.db.collection('gallery').doc(id).set({aid: res.id, kind: kind, t: Date.now()});
      }).then(function(){ gInfo(); say('Gespeichert!'); }).catch(function(){ gNote('Das hat leider nicht geklappt. Vielleicht ist die Datei zu groß.'); });
    } else {
      gal.local.push({local: true, kind: kind, url: URL.createObjectURL(f)}); gRender();
    }
  });
});
function gInit(){
  gRender(); gInfo();
  if (gal.inited) return; gal.inited = true;
  try {
    if (window.claude && claude.use){
      claude.use('assets').then(function(a){ gal.assets = a; gInfo(); }).catch(function(){});
      claude.use('db').then(function(d){
        gal.db = d; gInfo(); if (!d) return;
        d.collection('gallery').orderBy('t', 'desc').limit(300).onSnapshot(function(snap){
          gal.items = snap.docs.map(function(x){ var o = x.data(); return {id: x.id, aid: o.aid, kind: o.kind, url: '/_blob/' + o.aid}; });
          gRender();
        }, function(){});
      }).catch(function(){});
    }
  } catch (e) {}
}

<script>
(function(){
'use strict';
var stage = document.getElementById('stage'), picker = document.getElementById('picker'), pic = document.getElementById('pic'), tools = document.querySelector('#paint .tools');
if (!stage || !pic || !tools || typeof PIC_ORDER === 'undefined' || typeof drawPic !== 'function') return;
if (picker) picker.style.display = 'none';
var NS = 'http://www.w3.org/2000/svg';
function go(d){
  var i = PIC_ORDER.indexOf(picName), n = PIC_ORDER[(i + d + PIC_ORDER.length) % PIC_ORDER.length];
  drawPic(n); say(PIC_SAY[n] || n);
}
function nav(cls, label, d, path){
  var b = document.createElement('button'); b.className = 'navb ' + cls; b.setAttribute('aria-label', label);
  b.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="' + path + '" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  b.addEventListener('click', function(){ go(d); }); stage.appendChild(b);
}
nav('l', 'Voriges Bild', -1, 'M25 8 L12 20 L25 32');
nav('r', 'Nächstes Bild', 1, 'M15 8 L28 20 L15 32');
var acts = document.createElement('div'); acts.id = 'acts';
acts.innerHTML = '<button class="mode" id="pNew">🗑 Neu</button><button class="mode" id="pSave">💾 Speichern</button>';
tools.insertBefore(acts, tools.firstChild);
document.getElementById('pNew').addEventListener('click', function(){ drawPic(picName); say('Neu'); });

function paintBlob(cb){
  var svg = pic.cloneNode(true); svg.removeAttribute('id'); svg.setAttribute('xmlns', NS); svg.setAttribute('width', 800); svg.setAttribute('height', 800);
  var defs = svg.querySelector('defs');
  if (!defs){ defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild); }
  document.querySelectorAll('svg[width="0"] pattern').forEach(function(p){ defs.appendChild(p.cloneNode(true)); });
  var st = document.createElementNS(NS, 'style');
  st.textContent = '.r{fill:#fff;stroke:#4a2d5c;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}.line{fill:none;stroke:#4a2d5c;stroke-width:9;stroke-linecap:round}.dot{fill:#4a2d5c}.ol{fill:none;stroke:#4a2d5c;stroke-width:9;stroke-linejoin:round}';
  var bg = document.createElementNS(NS, 'rect'); bg.setAttribute('width', 400); bg.setAttribute('height', 400); bg.setAttribute('fill', '#fff');
  svg.insertBefore(bg, svg.firstChild); svg.insertBefore(st, svg.firstChild);
  var img = new Image();
  img.onload = function(){
    var c = document.createElement('canvas'); c.width = c.height = 800;
    c.getContext('2d').drawImage(img, 0, 0, 800, 800);
    c.toBlob(cb, 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
}
function done(btn, text){ btn.textContent = text; setTimeout(function(){ btn.textContent = '💾 Speichern'; }, 2500); }
function download(blob){
  try { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'almas-bild.png'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
}
document.getElementById('pSave').addEventListener('click', function(){
  var btn = this; btn.textContent = '⏳ ...';
  paintBlob(function(blob){
    if (!blob){ done(btn, 'Hat nicht geklappt'); return; }
    var ok = function(){ done(btn, '✔ Gespeichert'); say('Gespeichert! Dein Bild ist in der Galerie.'); burst(innerWidth / 2, innerHeight / 3, 30); };
    var fallback = function(){ download(blob); done(btn, '✔ Heruntergeladen'); say('Dein Bild ist heruntergeladen.'); };
    if (!(window.claude && claude.use)){ fallback(); return; }
    Promise.all([claude.use('assets'), claude.use('db')]).then(function(r){
      if (!r[0] || !r[1]){ fallback(); return; }
      return r[0].upload(blob).then(function(res){
        var id = 'g' + Date.now().toString(36) + (Math.random() * 1e4 | 0);
        return r[1].collection('gallery').doc(id).set({aid: res.id, kind: 'image', t: Date.now()});
      }).then(ok);
    }).catch(function(){ fallback(); });
  });
});
})();

</script>
